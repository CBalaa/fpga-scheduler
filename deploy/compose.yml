services:
  scheduler:
    build:
      context: ..
    user: "${FPGA_UID:-10001}:${FPGA_GID:-10001}"
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FPGA_PORT:-8765}:8765"
    volumes:
      - ${FPGA_STATE_DIR:-../state}:/var/lib/fpga-scheduler
      - ${FPGA_CONFIG:-./simulator.toml}:/etc/fpga-scheduler/config.toml:ro
      - ${FPGA_TOKEN_FILE:-../secrets/service.token}:/run/secrets/service.token:ro
    stop_grace_period: 20m
    healthcheck:
      test: ["CMD", "python", "-c", "from fpga_scheduler import Client; Client(token_file='/run/secrets/service.token').health()"]
      interval: 30s
      timeout: 5s
      retries: 3
